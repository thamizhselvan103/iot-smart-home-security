#!/usr/sbin/nft -f
flush ruleset

table inet iotfw {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    iifname "enp0s3" accept
    ip6 nexthdr icmpv6 accept
    ip protocol icmp icmp type echo-request limit rate 10/second accept
    iifname "enp0s9" tcp dport 22 accept
    limit rate 5/second log prefix "FW-INPUT-DROP: "
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname "enp0s8" oifname "enp0s10" ip saddr 10.10.10.0/24 ip daddr 10.10.30.10 tcp dport 8883 accept
    iifname "enp0s9" accept
    limit rate 5/second log prefix "FW-FWD-DROP: "
  }
}
